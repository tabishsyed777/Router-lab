worker_processes 1;
pid /tmp/route-nginx.pid;
error_log /tmp/route-nginx-error.log;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/route-client-body;
    proxy_temp_path /tmp/route-proxy-temp;
    fastcgi_temp_path /tmp/route-fastcgi;
    uwsgi_temp_path /tmp/route-uwsgi;
    scgi_temp_path /tmp/route-scgi;
    server {
        listen 8080;
        server_name _;
        # Incident: broad routing, wrong prefix and no authorization boundary.
        location / { proxy_pass http://127.0.0.1:9001; }
    }
}
