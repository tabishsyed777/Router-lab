worker_processes 1;
pid /tmp/route-nginx.pid;
error_log /tmp/route-nginx-error.log;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/route-client-body;
    proxy_temp_path /tmp/route-proxy-temp;
    fastcgi_temp_path /tmp/route-fastcgi;
    uwsgi_temp_path /tmp/route-uwsgi;
    scgi_temp_path /tmp/route-scgi;
    server {
        listen 8080;
        server_name _;
        location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
        location = /api { return 308 /api/$is_args$args; }
        location /api/ {
            if ($http_authorization != "Bearer route-lab-token") { return 401; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_pass http://127.0.0.1:9001/;
        }
        location / { return 404; }
    }
}
